<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Diagram Maker</title>


    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
   <!-- <script src="libraries/p5.sound.min.js"></script>

   -->
  </head>

  <body onresize="run()">

    <div class="header">
      
        <ul>
          <li style="margin-right: auto">VectorLab</li>
          <li><a href="index.html">Home</a></li>
          <li><a href="fbd.html">Diagram Maker</a></li>
        </ul>
    </div>
    
    <div class="section " >
        <div class="diagram" >
            <iframe id="iframe" src="diagram.html"></iframe>
        </div>
        <div class="inputs">
            <ul>
                <li>
                    <input type="checkbox" class="check" id="checkA" checked="true" onclick="showTextbox('A')">
                    <label>Applied Force</label>
                    <input type="number" class="number" id="textA" min="0" max="1000" step="any">
                    <label id="labelA" class="hidelabel">N</label >
                    <input type="number" class="number" id="angleA" min="-360" max="360" step="any">
                    <label id="label2A" class="hidelabel">°</label >
                </li>
                <li>
                    <input type="checkbox" class="check" id="checkG" checked="true" disabled="disabled" readonly="readonly">
                    <label>Gravitational Force</label>
                    <input type="number" class="number" id="textG" style="display: flex" min="0" max="1000" step="any" >
                    <label id="labelG" >N</label >
                    <input type="number" class="number" id="angleG" min="-360" max="360" step="any">
                    <label id="label2G" class="hidelabel">°</label >
                </li>
                <li>
                    <input type="checkbox" class="check" id="checkN" checked="true" onclick="showTextbox('N')">
                    <label>Normal Force</label>
                    <input type="number" class="number" id="textN" min="0" max="1000" step="any">
                    <label id="labelN" class="hidelabel">N</label >
                    <input type="number" class="number" id="angleN" min="-360" max="360" step="any">
                    <label id="label2N" class="hidelabel">°</label >
                </li>
                <li>
                    <input type="checkbox" class="check" id="checkF" checked="true" onclick="showTextbox('F')">
                    <label>Friction Force</label>
                    <input type="number" class="number" id="textF" min="0" max="1000" step="any">
                    <label id="labelF" class="hidelabel">N</label >
                    <input type="number" class="number" id="angleF" min="-360" max="360" step="any">
                    <label id="label2F" class="hidelabel">°</label >
                </li>
            </ul>


            <div>
                <input type="checkbox" class="check" id="checkForce" value="yes">
                <label>Show Net Force</label>
                <label id="netForce"></label>
                    
            </div>

            <div>
                <input type="radio" id="radioM" class="radio" name="ma" onchange="showRadio()">Mass: </input> 
                <input type ="number" id="radioboxM" class="number" disabled="disabled" placeholder="">kg</input>
                <br>
                <input type="radio" id="radioA" class="radio" name="ma" onchange="showRadio()">Acceleration</input>
                <input type ="number" id="radioboxA" class="number" disabled="disabled" placeholder="">m/s²</input>
                <text id="accelAngle">[]</text>
            </div>

            <script src="force-input.js"></script>
            <!--<script src="fbd.js"></script>-->
            <script>

                setInterval(function () {
                    valueCheck("A");
                    valueCheck("G");
                    valueCheck("N");
                    valueCheck("F");
                    angleCheck("A");
                    angleCheck("G");
                    angleCheck("N");
                    angleCheck("F");
                    //calculateMassAccel();
                    run();
                    }, 10);

                    
            </script>

            <!--<button onclick="document.getElementById('iframe').contentWindow.drawLine(document.getElementById('textA').value, document.getElementById('textG').value)">Submit</button> -->
        
        <br>
        <br>
            <button onclick="reset()">Reset</button>
        </div>
    </div>

    
    <script>

        iframe.contentWindow.windowResized();
            function showTextbox(id){
                const checkbox = document.getElementById("check" + id);
                const textbox = document.getElementById("text" + id);
                const label = document.getElementById("label" + id);
                const angle = document.getElementById("angle" + id);
                const label2 = document.getElementById("label2" + id);
                if (checkbox.checked){
                    textbox.style.display = "flex";
                    label.style.display = "flex";
                    angle.style.display = "flex";
                    label2.style.display = "flex";
                }
                else {
                    textbox.style.display = "none";
                    label.style.display = "none";
                    angle.style.display = "none";
                    label2.style.display = "none";
                    angle.value = 0;
                    textbox.value = 0;
                    //textbox.value = "";

                }
                
            }


            document.getElementById('textA').addEventListener("input", run );
            document.getElementById('textG').addEventListener('input', run );
            document.getElementById('textN').addEventListener("input", run );
            document.getElementById('textF').addEventListener('input', run );
            function run(){
                let lengthA = document.getElementById('textA').value;
                let lengthG = document.getElementById('textG').value;
                let lengthN = document.getElementById('textN').value;
                let lengthF = document.getElementById('textF').value;

                let angleA = document.getElementById('angleA').value;
                let angleG = document.getElementById('angleG').value;
                let angleN = document.getElementById('angleN').value;
                let angleF = document.getElementById('angleF').value;

                const forces = [lengthA, lengthG, lengthN, lengthF];
                const angles = [angleA, angleG, angleN, angleF];
                iframe.contentWindow.getForces(forces, angles);
                
                let data = iframe.contentWindow.findNetForce();
                if (document.getElementById('checkForce').checked){
                    if (data[2]=="←" && data[3]=="↓"){
                        iframe.contentWindow.showNetForce(data[0], Math.PI + data[1]);
                    }
                    else if (data[2]=="←"){
                        iframe.contentWindow.showNetForce(data[0], Math.PI - data[1]);
                    }
                    else if (data[3]=="↓"){
                        iframe.contentWindow.showNetForce(data[0], -data[1]);
                    }
                    else {
                        iframe.contentWindow.showNetForce(data[0], data[1]);
                    }
                    
                }

                
               data[1]=iframe.contentWindow.myRound(data[1]*180/Math.PI, 1);
               if (Number.isNaN(data[1])||data[1]==0){
                    data[1]="";
                }
                else {
                    data[1]+="°";
                }
               //console.log(data[1]);
                document.getElementById("netForce").textContent = data[0] + " N [" + data[2] + data[1] + data[3]+"]";

                if (document.getElementById("radioM").checked == true) {
                    if (document.getElementById("radioboxM").value <= 0) {
                        document.getElementById("radioboxA").placeholder = "-";
                    }
                    else {
                        document.getElementById("radioboxA").value = data[0] / document.getElementById("radioboxM").value;
                    }
                }
                else if (document.getElementById("radioA").checked == true) {
                    if (document.getElementById("radioboxA").value <= 0) {
                        document.getElementById("radioboxM").placeholder = "-";
                    }
                    else {
                        document.getElementById("radioboxM").value = data[0] / document.getElementById("radioboxA").value;
                    }
                }
                document.getElementById("accelAngle").textContent = "[" + data[2] + data[1] + data[3]+"]";
                
            }

            window.addEventListener("resize", resize);
            function resize() {
                iframe.contentWindow.windowResized();
                
            }

            



            
    </script>

  </body>
</html>
